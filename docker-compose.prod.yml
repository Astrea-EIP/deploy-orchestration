# Runs the whole Astrea stack from the published GHCR images, instead of
# building from source. See README.md: generate the .env file first with
# scripts/render_env.py, then `docker compose -f docker-compose.prod.yml up`.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - astrea-mongo-data:/data/db

  # Self-contained image: the config, the custom models and the pre-built
  # routing graph are baked in at publish time (see deploy-orchestration#19). No bind mount
  # and no volume on /data/graphhopper: the container layer is writable, which
  # satisfies GraphHopper's gh.lock. Port 8989 is only reachable from api-back.
  graphhopper:
    image: ghcr.io/astrea-eip/graphhopper:${GRAPHHOPPER_VERSION}
    restart: unless-stopped
    mem_limit: 1424m
    environment:
      # SerialGC is forced: the JVM picks G1 above ~1.8 GB of container memory,
      # and G1 runs out of memory at this heap size while loading the graph.
      JAVA_OPTS: "-Xmx1024m -XX:+UseSerialGC"

  api-back:
    image: ghcr.io/astrea-eip/api-back:${API_BACK_VERSION}
    restart: unless-stopped
    depends_on:
      - mongo
      - graphhopper
    ports:
      - "5217:5217"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDb__ConnectionString: mongodb://mongo:27017
      MongoDb__DatabaseName: astrea_proto
      GraphHopper__BaseUrl: http://graphhopper:8989

  app-web:
    image: ghcr.io/astrea-eip/app-web:${APP_WEB_VERSION}
    restart: unless-stopped
    depends_on:
      - api-back
    ports:
      - "4200:4200"

volumes:
  astrea-mongo-data:
