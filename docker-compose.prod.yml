# Runs the whole Astrea stack from the published GHCR images, instead of
# building from source. See README.md: generate the .env file first with
# scripts/render_env.py, then `docker compose -f docker-compose.prod.yml up`.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - astrea-mongo-data:/data/db

  graphhopper:
    image: ghcr.io/astrea-eip/graphhopper:${GRAPHHOPPER_VERSION}
    restart: unless-stopped
    command: ["/config.yml"]
    ports:
      - "8989:8989"
    volumes:
      - ./data:/data
      - ../core-moteur/graphhopper/config.yml:/config.yml:ro
      - ../core-moteur/graphhopper/custom_models:/data/custom_models:ro

  api-back:
    image: ghcr.io/astrea-eip/api-back:${API_BACK_VERSION}
    restart: unless-stopped
    depends_on:
      - mongo
      - graphhopper
    ports:
      - "5217:5217"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDb__ConnectionString: mongodb://mongo:27017
      MongoDb__DatabaseName: astrea_proto
      GraphHopper__BaseUrl: http://graphhopper:8989

  app-web:
    image: ghcr.io/astrea-eip/app-web:${APP_WEB_VERSION}
    restart: unless-stopped
    depends_on:
      - api-back
    ports:
      - "4200:4200"

volumes:
  astrea-mongo-data:
